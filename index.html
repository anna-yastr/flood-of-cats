<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flood of Cats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" />
  <link rel="preload" href="assets/border-image.png" as="image" />
  <link rel="preload" href="assets/border-image1.png" as="image" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="wrap">
    <header class="top">
      <div class="titleBlock">
        <img src="assets/title.png" alt="Flood of Cats" class="titleImg" />
      </div>
    </header>

    <div class="scoreBar">
      <img src="assets/Score_img_1.png" alt="" class="scoreIcon" id="scoreIcon" />
      <span class="scoreLabel">Score</span>
      <span class="scoreText" id="scoreText">0</span>
    </div>
    <span class="streakBonus" id="streakBonus"></span>

    <div class="gameArea">
      <div class="canvasFrame">
        <canvas id="game" width="720" height="720"></canvas>
        <canvas id="pawCanvas"></canvas>
        <img class="borderImg" src="assets/border-image.png" alt="" />
      </div>
    </div>
  </div> <!-- ВАЖНО: закрыли wrap -->

  <button id="resetScoreBtn">Reset all score</button>

  <script src="js/settings.js"></script>
  <script src="js/state.js"></script>
  <script src="js/spawn.js"></script>
  <script src="js/draw-field.js"></script>
  <script src="js/draw-water.js"></script>
  <script src="js/draw-cats.js"></script>
  <script src="js/draw-ui.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
  <script>
    const _borderSrcs = ['assets/border-image.png', 'assets/border-image1.png'];
    let _borderFrame = 0;
    setInterval(() => {
      _borderFrame = 1 - _borderFrame;
      document.querySelector('.borderImg').src = _borderSrcs[_borderFrame];
    }, 600);

    const _scoreSrcs = ['assets/Score_img_1.png', 'assets/Score_img_2.png'];
    let _scoreFrame = 0;
    setInterval(() => {
      _scoreFrame = 1 - _scoreFrame;
      document.getElementById('scoreIcon').src = _scoreSrcs[_scoreFrame];
    }, 900);
  </script>
</body>
</html>
