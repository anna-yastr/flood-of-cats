<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flood of Cats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" />
  <link rel="preload" href="assets/border-image.png" as="image" />
  <link rel="preload" href="assets/border-image1.png" as="image" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="wrap">
    <header class="top">
      <div class="titleBlock">
        <img src="assets/title.png" alt="Flood of Cats" class="titleImg" />
      </div>
    </header>

    <div class="gameArea">
      <div class="canvasFrame">
        <canvas id="game" width="720" height="720"></canvas>
      </div>
    </div>
  </div> <!-- ВАЖНО: закрыли wrap -->

  <script src="game.js"></script>
  <script>
    setInterval(() => {
      document.querySelector('.canvasFrame').classList.toggle('border-alt');
    }, 600);
  </script>
</body>
</html>
